apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "perf-test-generator.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "perf-test-generator.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "perf-test-generator.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - {}
  egress:
    - {}
